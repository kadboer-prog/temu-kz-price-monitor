name: Temu KZ Price Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Kazakhstan (Almaty) is UTC+5.
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Temu prices
        run: python scraper.py

      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "chore: update Temu KZ price history"
            git push
          fi
